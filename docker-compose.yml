services:
    nginx:
        image: nginx:latest
        ports:
            - 80:80
        volumes:
            - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./.docker/nginx/html:/usr/share/nginx/html
    frankenphp:
        build:
            context: .
            dockerfile: ./.docker/octane/Dockerfile
        entrypoint: php artisan octane:frankenphp --max-requests=1
        # ports:
        #     - 8000:8000
        volumes:
            - ./storage/logs:/app/storage/logs
        tty: true
    redis:
        image: redis:alpine
        volumes:
            - redis:/data
        ports:
            - 12379:6379
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    postgres:
        image: postgres:alpine
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - 12432:5432
        environment:
            TZ: UTC
            POSTGRES_DB: laravel
            POSTGRES_USER: root
            POSTGRES_PASSWORD: root
        healthcheck:
            test: ["CMD", "pg_isready", "-q", "-d", "laravel", "-U", "root"]
            retries: 3
            timeout: 5s
    minio:
        build:
            context: .
            dockerfile: ./.docker/minio/Dockerfile
        ports:
            - "12900:9000"
            - "12901:9001"
        environment:
            - MINIO_ROOT_USER=minio
            - MINIO_ROOT_PASSWORD=minio123
        volumes:
            - minio:/data
            - ./.docker/minio/export:/export
            - ./.docker/minio/policies:/policies
volumes:
    postgres_data:
        driver: local
    minio:
        driver: local
    redis:
        driver: local
