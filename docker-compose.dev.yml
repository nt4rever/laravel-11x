services:
    redis:
        image: redis:alpine
        volumes:
            - redis:/data
        ports:
            - 12379:6379
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    postgres:
        image: postgres:alpine
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./.docker/postgres/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql
        ports:
            - 12432:5432
        environment:
            TZ: UTC
            POSTGRES_DB: laravel
            POSTGRES_USER: root
            POSTGRES_PASSWORD: root
        healthcheck:
            test: ["CMD", "pg_isready", "-q", "-d", "laravel", "-U", "root"]
            retries: 3
            timeout: 5s
    minio:
        build:
            context: .
            dockerfile: ./.docker/minio/Dockerfile
        ports:
            - "12900:9000"
            - "12901:9001"
        environment:
            - MINIO_ROOT_USER=minio
            - MINIO_ROOT_PASSWORD=minio123
        volumes:
            - minio:/data
            - ./.docker/minio/export:/export
            - ./.docker/minio/policies:/policies
volumes:
    postgres_data:
        driver: local
    minio:
        driver: local
    redis:
        driver: local
